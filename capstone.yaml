run: docker compose up --build            # API on :8000, customer site on :5500
seed: docker compose exec api python -m scripts.seed
test: python -m pytest -q                  # no Docker or network needed (SQLite + mock geo)
base_url: http://localhost:8000
customer_site: http://localhost:5500       # second origin that embeds the widget
demo:
  owner: { email: demo@example.com, password: demo-password-123 }
  widget_ids: [demo-signup, demo-contact, demo-popover]
endpoints:
  - { method: GET,  path: /healthz }
  - { method: GET,  path: /widget.js?id=demo-contact }
  - { method: GET,  path: /widgets/demo-contact/config }
  - { method: POST, path: /submissions, note: 'JSON {"widget_id","data":{...}}; honeypot field "website"' }
  - { method: POST, path: /api/auth/login }
  - { method: GET,  path: /api/widgets,               auth: bearer }
  - { method: GET,  path: /api/dashboard/submissions, auth: bearer }
  - { method: GET,  path: /api/dashboard/stats,       auth: bearer }
fault_injection:   # dev only (DEBUG_ENDPOINTS=1, GEO_MODE=mock) - used by probes 4 and 5
  - { method: POST, path: /_debug/faults, body: '{"geo_down":["a","b"],"email_fail":true}' }
  - { method: POST, path: /_debug/drain-jobs }
probes: python -m scripts.run_probes --base http://localhost:8000
